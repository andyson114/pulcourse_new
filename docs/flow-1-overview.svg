<svg xmlns="http://www.w3.org/2000/svg" width="680" height="545" viewBox="0 0 680 545" role="img"><title>사용 목적별 모듈 구성</title><desc>첫 화면에서 사용 목적을 고르면 목적별 모듈로 들어가고, 모든 목적이 공통 탭을 함께 쓴다.</desc><style>
text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.th{font-size:14px;font-weight:700;fill:#2B3037}
.ts{font-size:12px;fill:#5F6670}
rect{stroke-width:1}
.box{fill:#F4F5F7;stroke:#B8BEC6}
.bg{fill:#FFFFFF;stroke:none}
.arr{stroke:#8A9099;stroke-width:1.5;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A9099" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="545" rx="12"/><g><rect class="box" x="240" y="30" width="200" height="56" rx="8"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">페이지 열기</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">메뉴 지정 주소 지원</text></g><line x1="340" y1="86" x2="340" y2="118" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="230" y="120" width="220" height="56" rx="8"/><text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central">사용 목적 선택</text><text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central">첫 화면 · 목적 카드 4개</text></g><path d="M340 176 V206" class="arr"/><path d="M115 206 H565" class="arr"/><line x1="115" y1="206" x2="115" y2="234" class="arr" marker-end="url(#arrow)"/><line x1="265" y1="206" x2="265" y2="234" class="arr" marker-end="url(#arrow)"/><line x1="415" y1="206" x2="415" y2="234" class="arr" marker-end="url(#arrow)"/><line x1="565" y1="206" x2="565" y2="234" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="50" y="236" width="130" height="56" rx="8"/><text class="th" x="115" y="254" text-anchor="middle" dominant-baseline="central">영양사용</text><text class="ts" x="115" y="274" text-anchor="middle" dominant-baseline="central">식단 설계</text></g><g class="c-teal"><rect x="200" y="236" width="130" height="56" rx="8"/><text class="th" x="265" y="254" text-anchor="middle" dominant-baseline="central">기업·운영사용</text><text class="ts" x="265" y="274" text-anchor="middle" dominant-baseline="central">성과 관리</text></g><g class="c-coral"><rect x="350" y="236" width="130" height="56" rx="8"/><text class="th" x="415" y="254" text-anchor="middle" dominant-baseline="central">이용자용</text><text class="ts" x="415" y="274" text-anchor="middle" dominant-baseline="central">환경 교육</text></g><g><rect class="box" x="500" y="236" width="130" height="56" rx="8"/><text class="th" x="565" y="254" text-anchor="middle" dominant-baseline="central">전체 보기</text><text class="ts" x="565" y="274" text-anchor="middle" dominant-baseline="central">기존 화면</text></g><line x1="115" y1="292" x2="115" y2="334" class="arr" marker-end="url(#arrow)"/><line x1="265" y1="292" x2="265" y2="334" class="arr" marker-end="url(#arrow)"/><line x1="415" y1="292" x2="415" y2="334" class="arr" marker-end="url(#arrow)"/><line x1="565" y1="292" x2="565" y2="334" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="50" y="336" width="130" height="56" rx="8"/><text class="th" x="115" y="354" text-anchor="middle" dominant-baseline="central">메뉴 교환</text><text class="ts" x="115" y="374" text-anchor="middle" dominant-baseline="central">+ 한 달 식단</text></g><g class="c-teal"><rect x="200" y="336" width="130" height="56" rx="8"/><text class="th" x="265" y="354" text-anchor="middle" dominant-baseline="central">한 달 식단</text><text class="ts" x="265" y="374" text-anchor="middle" dominant-baseline="central">+ 대시보드</text></g><g class="c-coral"><rect x="350" y="336" width="130" height="56" rx="8"/><text class="th" x="415" y="354" text-anchor="middle" dominant-baseline="central">교육 모듈</text><text class="ts" x="415" y="374" text-anchor="middle" dominant-baseline="central">메뉴 골라 보기</text></g><g><rect class="box" x="500" y="336" width="130" height="56" rx="8"/><text class="th" x="565" y="354" text-anchor="middle" dominant-baseline="central">교육 모듈</text><text class="ts" x="565" y="374" text-anchor="middle" dominant-baseline="central">+ 대시보드 4탭</text></g><line x1="115" y1="392" x2="115" y2="430" class="arr" marker-end="url(#arrow)"/><line x1="265" y1="392" x2="265" y2="430" class="arr" marker-end="url(#arrow)"/><line x1="415" y1="392" x2="415" y2="430" class="arr" marker-end="url(#arrow)"/><line x1="565" y1="392" x2="565" y2="430" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="50" y="432" width="580" height="56" rx="8" stroke-dasharray="4 3"/><text class="th" x="340" y="450" text-anchor="middle" dominant-baseline="central">모든 목적 공통 탭</text><text class="ts" x="340" y="470" text-anchor="middle" dominant-baseline="central">메뉴별 CO₂e 비교 · 어떻게 계산하나요?</text></g><text class="ts" x="340" y="518" text-anchor="middle" dominant-baseline="central">↻ 어느 화면에서든 '목적 바꾸기'를 누르면 첫 화면으로</text></svg>
