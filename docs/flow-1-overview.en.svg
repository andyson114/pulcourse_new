<svg xmlns="http://www.w3.org/2000/svg" width="680" height="545" viewBox="0 0 680 545" role="img"><title>Modules by purpose</title><desc>Choosing a purpose on the first screen opens the modules for that purpose; every purpose also shares the common tabs.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.th{font-size:14px;font-weight:700;fill:#2B3037}
.ts{font-size:12px;fill:#5F6670}
.th.n{font-size:13px}
.ts.n{font-size:11px}
rect{stroke-width:1}
.box{fill:#F4F5F7;stroke:#B8BEC6}
.bg{fill:#FFFFFF;stroke:none}
.arr{stroke:#8A9099;stroke-width:1.5;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A9099" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="545" rx="12"/><g><rect class="box" x="240" y="30" width="200" height="56" rx="8"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Open the page</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Menus can be set in the URL</text></g><line x1="340" y1="86" x2="340" y2="118" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="230" y="120" width="220" height="56" rx="8"/><text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central">Choose a purpose</text><text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central">First screen · 4 purpose cards</text></g><path d="M340 176 V206" class="arr"/><path d="M115 206 H565" class="arr"/><line x1="115" y1="206" x2="115" y2="234" class="arr" marker-end="url(#arrow)"/><line x1="265" y1="206" x2="265" y2="234" class="arr" marker-end="url(#arrow)"/><line x1="415" y1="206" x2="415" y2="234" class="arr" marker-end="url(#arrow)"/><line x1="565" y1="206" x2="565" y2="234" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="45" y="236" width="140" height="56" rx="8"/><text class="th n" x="115" y="254" text-anchor="middle" dominant-baseline="central">Menu Planning</text><text class="ts n" x="115" y="274" text-anchor="middle" dominant-baseline="central">For dietitians</text></g><g class="c-teal"><rect x="195" y="236" width="140" height="56" rx="8"/><text class="th n" x="265" y="254" text-anchor="middle" dominant-baseline="central">Impact Tracking</text><text class="ts n" x="265" y="274" text-anchor="middle" dominant-baseline="central">Companies &amp; operators</text></g><g class="c-coral"><rect x="345" y="236" width="140" height="56" rx="8"/><text class="th n" x="415" y="254" text-anchor="middle" dominant-baseline="central">Climate Education</text><text class="ts n" x="415" y="274" text-anchor="middle" dominant-baseline="central">For diners</text></g><g><rect class="box" x="495" y="236" width="140" height="56" rx="8"/><text class="th n" x="565" y="254" text-anchor="middle" dominant-baseline="central">View All</text><text class="ts n" x="565" y="274" text-anchor="middle" dominant-baseline="central">Original screens</text></g><line x1="115" y1="292" x2="115" y2="334" class="arr" marker-end="url(#arrow)"/><line x1="265" y1="292" x2="265" y2="334" class="arr" marker-end="url(#arrow)"/><line x1="415" y1="292" x2="415" y2="334" class="arr" marker-end="url(#arrow)"/><line x1="565" y1="292" x2="565" y2="334" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="45" y="336" width="140" height="56" rx="8"/><text class="th n" x="115" y="354" text-anchor="middle" dominant-baseline="central">Menu Swap</text><text class="ts n" x="115" y="374" text-anchor="middle" dominant-baseline="central">+ Monthly Menu</text></g><g class="c-teal"><rect x="195" y="336" width="140" height="56" rx="8"/><text class="th n" x="265" y="354" text-anchor="middle" dominant-baseline="central">Monthly Menu</text><text class="ts n" x="265" y="374" text-anchor="middle" dominant-baseline="central">+ Dashboard</text></g><g class="c-coral"><rect x="345" y="336" width="140" height="56" rx="8"/><text class="th n" x="415" y="354" text-anchor="middle" dominant-baseline="central">Education module</text><text class="ts n" x="415" y="374" text-anchor="middle" dominant-baseline="central">Try choosing a menu</text></g><g><rect class="box" x="495" y="336" width="140" height="56" rx="8"/><text class="th n" x="565" y="354" text-anchor="middle" dominant-baseline="central">Education module</text><text class="ts n" x="565" y="374" text-anchor="middle" dominant-baseline="central">+ 4 dashboard tabs</text></g><line x1="115" y1="392" x2="115" y2="430" class="arr" marker-end="url(#arrow)"/><line x1="265" y1="392" x2="265" y2="430" class="arr" marker-end="url(#arrow)"/><line x1="415" y1="392" x2="415" y2="430" class="arr" marker-end="url(#arrow)"/><line x1="565" y1="392" x2="565" y2="430" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="45" y="432" width="590" height="56" rx="8" stroke-dasharray="4 3"/><text class="th" x="340" y="450" text-anchor="middle" dominant-baseline="central">Tabs shared by every purpose</text><text class="ts" x="340" y="470" text-anchor="middle" dominant-baseline="central">CO₂e by Menu · How It's Calculated</text></g><text class="ts" x="340" y="518" text-anchor="middle" dominant-baseline="central">↻ ‘Change purpose’ on any screen goes back to the first screen</text></svg>
