<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img"><title>Education module flow for diners</title><desc>After choosing a menu, diners see different scenes depending on whether they picked the high- or low-CO₂e menu, then move on to the result and the pledge.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.th{font-size:14px;font-weight:700;fill:#2B3037}
.ts{font-size:12px;fill:#5F6670}
.th.n{font-size:13px}
.ts.n{font-size:11px}
rect{stroke-width:1}
.box{fill:#F4F5F7;stroke:#B8BEC6}
.bg{fill:#FFFFFF;stroke:none}
.arr{stroke:#8A9099;stroke-width:1.5;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A9099" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="760" rx="12"/><g><rect class="box" x="240" y="30" width="200" height="56" rx="8"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Start</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Today’s two menus</text></g><line x1="340" y1="86" x2="340" y2="114" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="240" y="116" width="200" height="56" rx="8"/><text class="th" x="340" y="134" text-anchor="middle" dominant-baseline="central">Choose</text><text class="ts" x="340" y="154" text-anchor="middle" dominant-baseline="central">Put a menu on the tray</text></g><path d="M340 172 V192" class="arr"/><path d="M200 192 H480" class="arr"/><line x1="200" y1="192" x2="200" y2="212" class="arr" marker-end="url(#arrow)"/><line x1="480" y1="192" x2="480" y2="212" class="arr" marker-end="url(#arrow)"/><g class="c-coral"><rect x="90" y="214" width="220" height="56" rx="8"/><text class="th" x="200" y="232" text-anchor="middle" dominant-baseline="central">High-CO₂e menu</text><text class="ts" x="200" y="252" text-anchor="middle" dominant-baseline="central">e.g. beef rice soup</text></g><g class="c-teal"><rect x="370" y="214" width="220" height="56" rx="8"/><text class="th" x="480" y="232" text-anchor="middle" dominant-baseline="central">Low-CO₂e menu</text><text class="ts" x="480" y="252" text-anchor="middle" dominant-baseline="central">e.g. radish-greens soup</text></g><line x1="200" y1="270" x2="200" y2="298" class="arr" marker-end="url(#arrow)"/><line x1="480" y1="270" x2="480" y2="298" class="arr" marker-end="url(#arrow)"/><g class="c-coral"><rect x="90" y="300" width="220" height="56" rx="8"/><text class="th" x="200" y="318" text-anchor="middle" dominant-baseline="central">Story scenes</text><text class="ts" x="200" y="338" text-anchor="middle" dominant-baseline="central">Beef-heavy: cattle-farming scene</text></g><g class="c-teal"><rect x="370" y="300" width="220" height="56" rx="8"/><text class="th" x="480" y="318" text-anchor="middle" dominant-baseline="central">A lighter choice</text><text class="ts" x="480" y="338" text-anchor="middle" dominant-baseline="central">Shows the CO₂e saved</text></g><line x1="200" y1="356" x2="200" y2="384" class="arr" marker-end="url(#arrow)"/><g class="c-coral"><rect x="90" y="386" width="220" height="56" rx="8"/><text class="th" x="200" y="404" text-anchor="middle" dominant-baseline="central">Think again</text><text class="ts" x="200" y="424" text-anchor="middle" dominant-baseline="central">Keep it · Choose again</text></g><path d="M200 442 V472 H340" class="arr"/><path d="M480 356 V472 H340" class="arr"/><line x1="340" y1="472" x2="340" y2="494" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="240" y="496" width="200" height="56" rx="8"/><text class="th" x="340" y="514" text-anchor="middle" dominant-baseline="central">Result</text><text class="ts" x="340" y="534" text-anchor="middle" dominant-baseline="central">My CO₂e in everyday terms</text></g><line x1="340" y1="552" x2="340" y2="580" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="240" y="582" width="200" height="56" rx="8"/><text class="th" x="340" y="600" text-anchor="middle" dominant-baseline="central">Pledge</text><text class="ts" x="340" y="620" text-anchor="middle" dominant-baseline="central">Check CO₂e, too</text></g><path d="M340 638 V658" class="arr"/><path d="M200 658 H480" class="arr"/><line x1="200" y1="658" x2="200" y2="678" class="arr" marker-end="url(#arrow)"/><line x1="480" y1="658" x2="480" y2="678" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="90" y="680" width="220" height="56" rx="8"/><text class="th" x="200" y="698" text-anchor="middle" dominant-baseline="central">Dashboard tabs</text><text class="ts" x="200" y="718" text-anchor="middle" dominant-baseline="central">Menu comparison · Simulator</text></g><g><rect class="box" x="370" y="680" width="220" height="56" rx="8"/><text class="th" x="480" y="698" text-anchor="middle" dominant-baseline="central">Start over</text><text class="ts" x="480" y="718" text-anchor="middle" dominant-baseline="central">Back to the Start screen</text></g></svg>
