<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img"><title>영양사·기업용 계산 흐름</title><desc>메뉴 교환과 조절 막대 설정이 계산 엔진을 거쳐 한 달 식단과 대시보드로 나온다.</desc><style>
text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.th{font-size:14px;font-weight:700;fill:#2B3037}
.ts{font-size:12px;fill:#5F6670}
rect{stroke-width:1}
.box{fill:#F4F5F7;stroke:#B8BEC6}
.bg{fill:#FFFFFF;stroke:none}
.arr{stroke:#8A9099;stroke-width:1.5;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A9099" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="420" rx="12"/><g class="c-teal"><rect x="60" y="30" width="240" height="56" rx="8"/><text class="th" x="180" y="48" text-anchor="middle" dominant-baseline="central">메뉴 교환</text><text class="ts" x="180" y="68" text-anchor="middle" dominant-baseline="central">두 메뉴 CO₂e 비교·추천</text></g><g><rect class="box" x="380" y="30" width="240" height="56" rx="8"/><text class="th" x="500" y="48" text-anchor="middle" dominant-baseline="central">조절 막대</text><text class="ts" x="500" y="68" text-anchor="middle" dominant-baseline="central">고기 비율·인원·폐기 등</text></g><line x1="180" y1="86" x2="180" y2="124" class="arr" marker-end="url(#arrow)"/><line x1="500" y1="86" x2="500" y2="124" class="arr" marker-end="url(#arrow)"/><rect class="box" x="50" y="126" width="580" height="124" rx="12" stroke-dasharray="4 3"/><text class="th" x="66" y="146" dominant-baseline="central">계산 엔진 · 1인분 CO₂e</text><g><rect class="box" x="66" y="166" width="116" height="56" rx="8"/><text class="th" x="124" y="184" text-anchor="middle" dominant-baseline="central">이름 해석</text><text class="ts" x="124" y="204" text-anchor="middle" dominant-baseline="central">재료·조리법</text></g><line x1="182" y1="194" x2="208" y2="194" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="210" y="166" width="116" height="56" rx="8"/><text class="th" x="268" y="184" text-anchor="middle" dominant-baseline="central">레시피 분량</text><text class="ts" x="268" y="204" text-anchor="middle" dominant-baseline="central">재료별 1인분</text></g><line x1="326" y1="194" x2="352" y2="194" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="354" y="166" width="116" height="56" rx="8"/><text class="th" x="412" y="184" text-anchor="middle" dominant-baseline="central">배출계수</text><text class="ts" x="412" y="204" text-anchor="middle" dominant-baseline="central">생산부터 폐기</text></g><line x1="470" y1="194" x2="496" y2="194" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="498" y="166" width="116" height="56" rx="8"/><text class="th" x="556" y="184" text-anchor="middle" dominant-baseline="central">조리·폐기</text><text class="ts" x="556" y="204" text-anchor="middle" dominant-baseline="central">에너지·쓰레기</text></g><line x1="180" y1="250" x2="180" y2="288" class="arr" marker-end="url(#arrow)"/><line x1="500" y1="250" x2="500" y2="288" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="60" y="290" width="240" height="56" rx="8"/><text class="th" x="180" y="308" text-anchor="middle" dominant-baseline="central">한 달 식단</text><text class="ts" x="180" y="328" text-anchor="middle" dominant-baseline="central">4주 달력·끼니별 CO₂e</text></g><g class="c-teal"><rect x="380" y="290" width="240" height="56" rx="8"/><text class="th" x="500" y="308" text-anchor="middle" dominant-baseline="central">대시보드</text><text class="ts" x="500" y="328" text-anchor="middle" dominant-baseline="central">1년 누적·재료군별 차트</text></g><text class="ts" x="340" y="376" text-anchor="middle" dominant-baseline="central">한 달 식단과 대시보드는 같은 설정을 함께 써요</text><text class="ts" x="340" y="396" text-anchor="middle" dominant-baseline="central">1년 효과 = 한 끼 평균 × 하루 인원 × 점심 260일</text></svg>
