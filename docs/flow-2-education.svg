<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img"><title>이용자용 교육 모듈 흐름</title><desc>메뉴를 고른 뒤 CO₂e가 높은 메뉴와 낮은 메뉴에 따라 다른 장면을 거쳐 결과와 다짐으로 이어진다.</desc><style>
text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.th{font-size:14px;font-weight:700;fill:#2B3037}
.ts{font-size:12px;fill:#5F6670}
rect{stroke-width:1}
.box{fill:#F4F5F7;stroke:#B8BEC6}
.bg{fill:#FFFFFF;stroke:none}
.arr{stroke:#8A9099;stroke-width:1.5;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A9099" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="760" rx="12"/><g><rect class="box" x="240" y="30" width="200" height="56" rx="8"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">입장</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">오늘의 메뉴 두 가지</text></g><line x1="340" y1="86" x2="340" y2="114" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="240" y="116" width="200" height="56" rx="8"/><text class="th" x="340" y="134" text-anchor="middle" dominant-baseline="central">메뉴 고르기</text><text class="ts" x="340" y="154" text-anchor="middle" dominant-baseline="central">식판에 담기</text></g><path d="M340 172 V192" class="arr"/><path d="M200 192 H480" class="arr"/><line x1="200" y1="192" x2="200" y2="212" class="arr" marker-end="url(#arrow)"/><line x1="480" y1="192" x2="480" y2="212" class="arr" marker-end="url(#arrow)"/><g class="c-coral"><rect x="90" y="214" width="220" height="56" rx="8"/><text class="th" x="200" y="232" text-anchor="middle" dominant-baseline="central">높은 CO₂e 메뉴</text><text class="ts" x="200" y="252" text-anchor="middle" dominant-baseline="central">예: 소고기국밥</text></g><g class="c-teal"><rect x="370" y="214" width="220" height="56" rx="8"/><text class="th" x="480" y="232" text-anchor="middle" dominant-baseline="central">낮은 CO₂e 메뉴</text><text class="ts" x="480" y="252" text-anchor="middle" dominant-baseline="central">예: 시래기국</text></g><line x1="200" y1="270" x2="200" y2="298" class="arr" marker-end="url(#arrow)"/><line x1="480" y1="270" x2="480" y2="298" class="arr" marker-end="url(#arrow)"/><g class="c-coral"><rect x="90" y="300" width="220" height="56" rx="8"/><text class="th" x="200" y="318" text-anchor="middle" dominant-baseline="central">재료·환경 이야기</text><text class="ts" x="200" y="338" text-anchor="middle" dominant-baseline="central">소고기 많으면 사육 장면</text></g><g class="c-teal"><rect x="370" y="300" width="220" height="56" rx="8"/><text class="th" x="480" y="318" text-anchor="middle" dominant-baseline="central">가벼운 선택</text><text class="ts" x="480" y="338" text-anchor="middle" dominant-baseline="central">줄어든 CO₂e 보여 주기</text></g><line x1="200" y1="356" x2="200" y2="384" class="arr" marker-end="url(#arrow)"/><g class="c-coral"><rect x="90" y="386" width="220" height="56" rx="8"/><text class="th" x="200" y="404" text-anchor="middle" dominant-baseline="central">다시 고민하기</text><text class="ts" x="200" y="424" text-anchor="middle" dominant-baseline="central">그대로 먹기 · 다시 고르기</text></g><path d="M200 442 V472 H340" class="arr"/><path d="M480 356 V472 H340" class="arr"/><line x1="340" y1="472" x2="340" y2="494" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="240" y="496" width="200" height="56" rx="8"/><text class="th" x="340" y="514" text-anchor="middle" dominant-baseline="central">결과</text><text class="ts" x="340" y="534" text-anchor="middle" dominant-baseline="central">내 선택의 CO₂e·환산</text></g><line x1="340" y1="552" x2="340" y2="580" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="240" y="582" width="200" height="56" rx="8"/><text class="th" x="340" y="600" text-anchor="middle" dominant-baseline="central">다짐</text><text class="ts" x="340" y="620" text-anchor="middle" dominant-baseline="central">CO₂e도 같이 보기</text></g><path d="M340 638 V658" class="arr"/><path d="M200 658 H480" class="arr"/><line x1="200" y1="658" x2="200" y2="678" class="arr" marker-end="url(#arrow)"/><line x1="480" y1="658" x2="480" y2="678" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="90" y="680" width="220" height="56" rx="8"/><text class="th" x="200" y="698" text-anchor="middle" dominant-baseline="central">대시보드 탭</text><text class="ts" x="200" y="718" text-anchor="middle" dominant-baseline="central">메뉴 비교·시뮬레이터</text></g><g><rect class="box" x="370" y="680" width="220" height="56" rx="8"/><text class="th" x="480" y="698" text-anchor="middle" dominant-baseline="central">처음부터 다시</text><text class="ts" x="480" y="718" text-anchor="middle" dominant-baseline="central">입장 화면으로</text></g></svg>
