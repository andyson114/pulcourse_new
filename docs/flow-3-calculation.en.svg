<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img"><title>Calculation flow for dietitians and companies</title><desc>Menu Swap choices and slider settings go through the calculation engine and come out in the Monthly Menu and the Dashboard.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.th{font-size:14px;font-weight:700;fill:#2B3037}
.ts{font-size:12px;fill:#5F6670}
.th.n{font-size:13px}
.ts.n{font-size:11px}
rect{stroke-width:1}
.box{fill:#F4F5F7;stroke:#B8BEC6}
.bg{fill:#FFFFFF;stroke:none}
.arr{stroke:#8A9099;stroke-width:1.5;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A9099" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="420" rx="12"/><g class="c-teal"><rect x="60" y="30" width="240" height="56" rx="8"/><text class="th" x="180" y="48" text-anchor="middle" dominant-baseline="central">Menu Swap</text><text class="ts" x="180" y="68" text-anchor="middle" dominant-baseline="central">Compare 2 menus · suggestions</text></g><g><rect class="box" x="380" y="30" width="240" height="56" rx="8"/><text class="th" x="500" y="48" text-anchor="middle" dominant-baseline="central">Sliders</text><text class="ts" x="500" y="68" text-anchor="middle" dominant-baseline="central">Meat share, diners, waste, etc.</text></g><line x1="180" y1="86" x2="180" y2="124" class="arr" marker-end="url(#arrow)"/><line x1="500" y1="86" x2="500" y2="124" class="arr" marker-end="url(#arrow)"/><rect class="box" x="50" y="126" width="580" height="124" rx="12" stroke-dasharray="4 3"/><text class="th" x="62" y="146" dominant-baseline="central">Calculation engine · CO₂e per serving</text><g><rect class="box" x="60" y="166" width="126" height="56" rx="8"/><text class="th n" x="123" y="184" text-anchor="middle" dominant-baseline="central">Parse name</text><text class="ts n" x="123" y="204" text-anchor="middle" dominant-baseline="central">Ingredients, method</text></g><line x1="186" y1="194" x2="200" y2="194" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="202" y="166" width="126" height="56" rx="8"/><text class="th n" x="265" y="184" text-anchor="middle" dominant-baseline="central">Recipe amounts</text><text class="ts n" x="265" y="204" text-anchor="middle" dominant-baseline="central">Per serving</text></g><line x1="328" y1="194" x2="342" y2="194" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="344" y="166" width="126" height="56" rx="8"/><text class="th n" x="407" y="184" text-anchor="middle" dominant-baseline="central">Emission factors</text><text class="ts n" x="407" y="204" text-anchor="middle" dominant-baseline="central">Life-cycle stages</text></g><line x1="470" y1="194" x2="484" y2="194" class="arr" marker-end="url(#arrow)"/><g><rect class="box" x="486" y="166" width="126" height="56" rx="8"/><text class="th n" x="549" y="184" text-anchor="middle" dominant-baseline="central">Cooking &amp; waste</text><text class="ts n" x="549" y="204" text-anchor="middle" dominant-baseline="central">Energy, food waste</text></g><line x1="180" y1="250" x2="180" y2="288" class="arr" marker-end="url(#arrow)"/><line x1="500" y1="250" x2="500" y2="288" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="60" y="290" width="240" height="56" rx="8"/><text class="th" x="180" y="308" text-anchor="middle" dominant-baseline="central">Monthly Menu</text><text class="ts" x="180" y="328" text-anchor="middle" dominant-baseline="central">4-week calendar · CO₂e per meal</text></g><g class="c-teal"><rect x="380" y="290" width="240" height="56" rx="8"/><text class="th" x="500" y="308" text-anchor="middle" dominant-baseline="central">Dashboard</text><text class="ts" x="500" y="328" text-anchor="middle" dominant-baseline="central">Annual totals · food-group charts</text></g><text class="ts" x="340" y="376" text-anchor="middle" dominant-baseline="central">Monthly Menu and Dashboard share the same settings</text><text class="ts" x="340" y="396" text-anchor="middle" dominant-baseline="central">Annual effect = average per meal × daily diners × 260 lunch days</text></svg>
